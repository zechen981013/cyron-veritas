[project]
name = "cyron-veritas"
version = "0.1.0"
description = "AI 投研助手：组合风控日报 + DCF 研究 Agent（数字由代码计算，大模型负责规划、检索与解读）"
authors = [
    { name = "Cyrus72295", email = "64737795+zechen981013@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "akshare>=1.19.1",
    "deepagents==0.7.25",
    "fastapi>=0.148.0",
    "httpx>=0.28.1",
    "jieba>=0.42.1",
    "jinja2>=3.1.6",
    "langchain-openai>=1.7.2",
    "langgraph>=1.2.16",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "pydantic>=2.14.1",
    "pymilvus[milvus-lite]>=3.0.2",
    "pymupdf>=2.0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "rank-bm25>=0.2.2",
    "scipy>=1.18.1",
    "sentence-transformers>=6.1.0",
    "sse-starlette>=3.5.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
veritas = "cyron_veritas.cli:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "formulas>=1.3.4",
    "pytest>=9.1.1",
]
