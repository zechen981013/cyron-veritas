[project]
name = "analyst-desk"
version = "0.1.0"
description = "AI 投研助手：组合风控日报 + DCF 研究 Agent（数字由代码计算，大模型负责规划、检索与解读）"
authors = [
    { name = "Cyrus72295", email = "64737795+zechen981013@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "akshare>=1.19.1",
    "deepagents==0.7.25",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "langchain-openai>=1.7.2",
    "langgraph>=1.2.16",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "scipy>=1.18.1",
]

[project.scripts]
desk = "analyst_desk.cli:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "formulas>=1.3.4",
    "pytest>=9.1.1",
]
